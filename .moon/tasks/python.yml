$schema: 'https://moonrepo.dev/schemas/v2/tasks.json'

inheritedBy:
  tags: ['python']

fileGroups:
  sources:
    - 'src/**/*'
  configs:
    - 'pyproject.toml'
    - 'ruff.toml'
    - 'ty.toml'
    - '.python-version'
  tests:
    - 'tests/**/*'

tasks:
  install:
    command: 'uv sync --all-packages'
    toolchains: 'system'
    inputs:
      - 'pyproject.toml'
      - '/pyproject.toml'
      - '/uv.lock'
      - '/apps/*/pyproject.toml'
      - '.python-version'
    options:
      cache: false

  format:
    script: 'uv run --all-packages ruff check --fix-only . && uv run --all-packages ruff format .'
    toolchains: 'system'
    deps:
      - 'install'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@files(configs)'

  lint:
    script: 'uv run --all-packages ruff check . && uv run --all-packages ty check'
    toolchains: 'system'
    deps:
      - 'install'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@files(configs)'

  test:
    command: 'uv run --all-packages pytest'
    toolchains: 'system'
    deps:
      - 'install'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '@files(configs)'

  build:
    command: 'uv build --out-dir dist'
    toolchains: 'system'
    deps:
      - 'install'
    inputs:
      - '@globs(sources)'
      - '@files(configs)'
    outputs:
      - 'dist'
