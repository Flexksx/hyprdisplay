$schema: 'https://moonrepo.dev/schemas/v2/project.json'

language: 'python'
tags: ['python']
layer: 'application'
stack: 'backend'

tasks:
  start:
    command: 'uv run hyprdisplay-daemon'
    toolchains: 'system'
    options:
      cache: false
      persistent: true
  lint:
    script: 'uv run ruff check . && uv run ty check && uv run lint-imports'
