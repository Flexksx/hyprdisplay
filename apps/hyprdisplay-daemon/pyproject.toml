[project]
name = "hyprdisplay-daemon"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
hyprdisplay-daemon = "hyprdisplay_daemon.main:main"

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16",
    "ty>=0.0.77",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyprdisplay_daemon"]

[tool.importlinter]
root_package = "hyprdisplay_daemon"

[[tool.importlinter.contracts]]
name = "Each domain module has adapter, application, and domain layers"
type = "layers"
containers = ["hyprdisplay_daemon.display", "hyprdisplay_daemon.layout"]
layers = ["adapters", "application", "domain"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Domain layers do not import application or adapter layers"
type = "forbidden"
source_modules = ["hyprdisplay_daemon.*.domain"]
forbidden_modules = ["hyprdisplay_daemon.*.application", "hyprdisplay_daemon.*.adapters"]

[[tool.importlinter.contracts]]
name = "Application layers do not import adapter layers"
type = "forbidden"
source_modules = ["hyprdisplay_daemon.*.application"]
forbidden_modules = ["hyprdisplay_daemon.*.adapters"]
