[project]
name = "hyprdisplay"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
hyprdisplay = "hyprdisplay.main:main"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16", "ty>=0.0.77"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyprdisplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
