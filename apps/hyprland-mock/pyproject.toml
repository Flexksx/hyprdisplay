[project]
name = "hyprland-mock"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "click>=8",
    "pydantic>=2",
]

[project.scripts]
hyprland-mock = "hyprland_mock.main:main"
hyprland-mock-hyprctl = "hyprland_mock.main:hyprctl"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16", "ty>=0.0.77"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyprland_mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
