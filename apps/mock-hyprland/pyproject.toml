[project]
name = "mock-hyprland"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "click>=8",
    "pydantic>=2",
]

[project.scripts]
mock-hyprland = "mock_hyprland.main:main"
mock-hyprland-hyprctl = "mock_hyprland.main:hyprctl"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16", "ty>=0.0.77"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_hyprland"]

[tool.pytest.ini_options]
testpaths = ["tests"]
