[project]
name = "display-domain"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pytest>=9.1",
    "ruff>=0.16",
    "ty>=0.0.77",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/display_domain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "display_domain"

[[tool.importlinter.contracts]]
name = "Each domain module has application and domain layers"
type = "layers"
containers = ["display_domain.*"]
layers = ["application", "domain"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Domain layers never import application layers"
type = "forbidden"
source_modules = ["display_domain.*.domain"]
forbidden_modules = ["display_domain.*.application"]

[[tool.importlinter.contracts]]
name = "Application layers do not import other application layers"
type = "forbidden"
source_modules = ["display_domain.*.application"]
forbidden_modules = ["display_domain.*.application"]
