$schema: 'https://moonrepo.dev/schemas/v2/project.json'

layer: 'configuration'

tasks:
  test:
    command: 'apps/hyprland-mock/.venv/bin/pytest tests'
    toolchains: 'system'
    deps:
      - 'hyprdisplay-daemon:install'
      - 'hyprland-mock:install'
    inputs:
      - 'tests/**/*'
      - 'apps/hyprdisplay-daemon/src/**/*'
      - 'apps/hyprland-mock/src/**/*'
      - 'apps/hyprdisplay-daemon/pyproject.toml'
      - 'apps/hyprland-mock/pyproject.toml'
      - 'apps/hyprdisplay-daemon/uv.lock'
      - 'apps/hyprland-mock/uv.lock'
    options:
      runFromWorkspaceRoot: true

  format:
    command: 'alejandra .'
    toolchains: 'system'
    deps:
      - 'format-markdown'
    inputs:
      - '**/*.nix'
    options:
      runFromWorkspaceRoot: true

  format-markdown:
    command: 'rumdl check --fix .'
    toolchains: 'system'
    inputs:
      - '**/*.md'
    options:
      runFromWorkspaceRoot: true

  lint:
    script: 'rumdl check . && alejandra --check . && apps/hyprland-mock/.venv/bin/ruff check --config apps/hyprland-mock/ruff.toml tests && apps/hyprland-mock/.venv/bin/ty check --python apps/hyprland-mock/.venv tests'
    toolchains: 'system'
    deps:
      - 'hyprland-mock:install'
    inputs:
      - '**/*.md'
      - '**/*.nix'
      - 'tests/**/*.py'
      - 'apps/hyprland-mock/src/**/*'
      - 'apps/hyprland-mock/ruff.toml'
    options:
      runFromWorkspaceRoot: true

  install:
    command: 'pnpm install'
    toolchains: 'system'
    inputs:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'apps/*/package.json'
      - 'libs/*/package.json'
    options:
      runFromWorkspaceRoot: true
